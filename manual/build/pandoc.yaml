# Pandoc defaults for the PDF (arXiv-ready) build of the SMS++ User Manual.
# Usage (from the manual/build/ directory):
#     pandoc --defaults=pandoc.yaml -o ../SMS++-manual.pdf
# All paths are relative to manual/build/ (the intended working directory).

from: markdown+tex_math_dollars+pipe_tables+fenced_code_attributes
to: latex

# Single source, assembled in reading order. Keep this list in sync with
# the MkDocs nav in mkdocs.yml and with model.html.
input-files:
  - ../index.md
  - ../chapters/01-introduction.md
  - ../chapters/02-installation.md
  - ../chapters/03-mental-model.md
  - ../chapters/04-block.md
  - ../chapters/05-variable-constraint-objective.md
  - ../chapters/06-solver.md
  - ../chapters/07-physical-abstract.md
  - ../chapters/08-modification-janus.md
  - ../chapters/09-solution.md
  - ../chapters/10-r3block.md
  - ../chapters/11-configuration.md
  - ../chapters/12-sub-block.md
  - ../chapters/13-function-family.md
  - ../chapters/14-lag-benders-bfunction.md
  - ../chapters/15-methods-factory.md
  - ../chapters/16-change.md
  - ../chapters/17-parallel.md
  - ../chapters/18-factories-netcdf.md
  - ../chapters/R1-mcf.md
  - ../chapters/R2-knapsack-reopt.md
  - ../chapters/R3-cfl-three-ways.md
  - ../chapters/R4-cfl-lagrangian.md
  - ../chapters/R5-cfl-benders.md
  - ../chapters/A-writing-block.md
  - ../chapters/B-writing-solver.md
  - ../chapters/C-writing-modification.md
  - ../chapters/D-concept-block-map.md
  - ../chapters/Y-glossary.md
  - ../chapters/Z-bibliography.md

# Resolve ../figures/NAME.svg (rewritten to .pdf by the filter below).
resource-path:
  - .
  - ..
  - ../figures

filters:
  - figure-ext.lua
  - break-code.lua

pdf-engine: pdflatex

# The Markdown headings already carry manual numbers (for the web build);
# LaTeX auto-numbering is suppressed in preamble.tex to avoid duplication.
number-sections: false
toc: true
toc-depth: 2
top-level-division: chapter

include-in-header:
  - preamble.tex

metadata:
  title: "SMS++ — A User Manual"
  subtitle: "For SMS++ 0.6.0 (December 2025)"
  author: "Antonio Frangioni"
  lang: en
  colorlinks: true
  linkcolor: NavyBlue
  urlcolor: NavyBlue
  documentclass: report
  papersize: a4
