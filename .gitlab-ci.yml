image: alpine

before_script:
  - apk add --no-cache doxygen git

stages:
  - check
  - deploy
  - release

# The CHANGELOG of the umbrella, held to the format: the sections of Keep a
# Changelog and in its order, the dates, and one link reference per release
# that has a tag [see ./changelog]. It says nothing of the submodules, whose
# own pipelines check their own, so it needs no clone of them.
changelog:
  stage: check
  image: alpine
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    # a pipeline started by a module checks that module [see integration]
    - if: $SMSPP_MODULE
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
  variables:
    GIT_DEPTH: 0                       # the tags the links are checked against
  before_script:
    - apk add --no-cache git python3
  script:
    - ./changelog check --repo .

# The same over the whole project, submodules comprised, plus what the entries
# of their [Unreleased] do not say about the commits since their last tag.
# It is a report and not a gate, so it runs on a schedule and is allowed to
# fail: what it finds is read in its artifacts.
changelog_all:
  stage: check
  image: alpine
  rules:
    # the schedule of the night is the one that builds and tests, and has
    # nothing to do with this: each of the two schedules does its own thing
    - if: $NIGHTLY == "1"
      when: never
    - if: $CI_PIPELINE_SOURCE == "schedule"
  variables:
    GIT_DEPTH: 0
  before_script:
    - apk add --no-cache git python3
  script:
    - git submodule sync --recursive
    - git submodule update --init --recursive
    - git submodule foreach --quiet 'git fetch --tags --quiet || true'
    - ./changelog check -q | tee changelog-check.txt
    - ./changelog coverage --list | tee changelog-coverage.txt
  allow_failure: true
  artifacts:
    paths:
      - changelog-check.txt
      - changelog-coverage.txt
    expire_in: 30 days

# The project built and tested as a whole, every night: what each module
# checks of itself in its own pipeline is its own, while what only the
# umbrella has is the modules together and the suites of tests/, which read
# the instances of one module and solve them with the Solver of another.
# It runs on the schedule that sets NIGHTLY, and nowhere else, being the one
# thing here that costs more than seconds. One job builds, the others take
# the build and run their share of the suites, each of them well inside the
# hour a job is given.
.nightly:
  image: registry.gitlab.com/smspp/smspp-project
  rules:
    - if: $NIGHTLY == "1"
  variables:
    GIT_DEPTH: 0
    CCACHE_DIR: $CI_PROJECT_DIR/.ccache
    CCACHE_MAXSIZE: 2G
    CTEST_SKIP: ^(test_cuts|test_dynamic|CFL_test/batches/batch-ben)
    # how long one test may take; the suites of the unit commitment and of
    # the dynamic programming ask for more [see the jobs below]
    CTEST_TIMEOUT: "900"
  before_script:
    # the Gurobi WLS license from the masked variables, as the modules do;
    # without them the tests that ask for Gurobi are the ones that fail
    - |
      if [ -n "$GRB_WLSSECRET" ]; then
        printf 'LICENSEID=%s\nWLSACCESSID=%s\nWLSSECRET=%s\n' \
          "$GRB_LICENSEID" "$GRB_WLSACCESSID" "$GRB_WLSSECRET" > /tmp/gurobi.lic
        export GRB_LICENSE_FILE=/tmp/gurobi.lic
      fi

nightly:build:
  extends: .nightly
  stage: check
  timeout: 55m
  cache:
    key: nightly-$CI_COMMIT_REF_SLUG
    paths:
      - .ccache
  script:
    - apt-get update && apt-get install -y --no-install-recommends ccache
    - git submodule sync --recursive
    - git submodule update --init --recursive
    - ccache --zero-stats
    - cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_tests=ON
            -DCMAKE_C_COMPILER_LAUNCHER=ccache
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
    - cmake --build build -j$(nproc)
    - ccache --show-stats

# the build is not carried from one job to another: what is carried is the
# cache of ccache, which the job above fills, so that each of these compiles
# again in a few minutes instead of taking a build tree made in another
# container, where the paths CMake wrote are not the ones it finds.
#
# Each of them runs the suites of its share; the last one runs whatever the
# others do not, so that no suite is left out by a name nobody thought of.
.nightly:test:
  extends: .nightly
  stage: deploy
  # three hours, which is what a shared runner allows at most: the suites of
  # one job run one after the other, and the dynamic programming alone has
  # eleven of them, one of which re-runs four others end to end
  timeout: 3h
  # the WLS licence of the project gives two sessions at a time, and a
  # session is per container: four jobs solving with Gurobi at once are
  # refused the environment [GRBstartenv 10030], so they take their turn
  resource_group: gurobi
  retry:
    max: 2
    when: script_failure
  needs:
    - job: nightly:build
      artifacts: false
  cache:
    key: nightly-$CI_COMMIT_REF_SLUG
    paths:
      - .ccache
    policy: pull
  script:
    - !reference [ nightly:build , script ]
    # the two parts are kept apart because a quoted regex inside one variable
    # reaches ctest with its quotes and matches nothing
    # the suites whose configuration names CPXMILPSolver cannot run here,
    # the image of the project carrying no CPLEX
    # two at a time and no more: a Gurobi session is per process here, and
    # the WLS licence of the project gives two of them
    # a test refused the Gurobi environment because somebody else held the
    # sessions of the licence is tried again, which is not the same as
    # ignoring a failure: it has to pass on its own
    - cd build && ctest -j2 --timeout "$CTEST_TIMEOUT" --repeat until-pass:2
                        --output-on-failure
                        --no-tests=error "$CTEST_WHICH" "$CTEST_RE"
                        -E "$CTEST_SKIP"
  artifacts:
    when: always
    paths:
      - build/Testing/Temporary/LastTest.log
    expire_in: 7 days

# a runner of the shared fleet has two cores and is some times slower than
# the machines the batteries were written on: one of them takes 41 minutes
# there, so what a test may take is an hour, and the families that hold the
# long batteries are a job each, none of them near the three hours a job is
# given
nightly:core:
  extends: .nightly:test
  variables:
    CTEST_WHICH: -R
    CTEST_RE: ^(test_|Group_test|AbstractBlock|AbstractPath|SizeVariable|BoxSolver|Benders|Polyhedral|LagBFunction|QuadFunction|MILPSolver_)
    CTEST_TIMEOUT: "3600"

nightly:unitcommitment:
  extends: .nightly:test
  variables:
    CTEST_WHICH: -R
    CTEST_RE: ^(UCBlock_test|extract_uc)
    CTEST_TIMEOUT: "3600"

# the dynamic programming of the thermal units is a job of its own: with the
# unit commitment it does not fit the time a job is given. The validation of
# the claim of the paper, which re-runs four batteries end to end, is another
nightly:tudps:
  extends: .nightly:test
  variables:
    CTEST_WHICH: -R
    CTEST_RE: ^(TUDPS_test|extract_uc)
    CTEST_SKIP: ^TUDPS_test/batches/run-validation
    CTEST_TIMEOUT: "3600"

nightly:validation:
  extends: .nightly:test
  variables:
    CTEST_WHICH: -R
    CTEST_RE: ^TUDPS_test/batches/run-validation
    CTEST_TIMEOUT: "7200"

# the flows are two jobs: the batteries of the min-cost flow take 40 minutes
# each on a machine of ours, hence more than an hour here
nightly:mcf:
  extends: .nightly:test
  variables:
    CTEST_WHICH: -R
    CTEST_RE: ^(MCFBlock|MCFClassSolver|MCFLemonSolver|run_dmx)
    CTEST_TIMEOUT: "3600"

nightly:flows:
  extends: .nightly:test
  variables:
    CTEST_WHICH: -R
    CTEST_RE: ^(MMCFBlock|CFL_test|SingleFlowDCR)
    CTEST_TIMEOUT: "3600"

# the quadratic batteries over the integers are a job of their own: the three
# of them take 42, 33 and more than 60 minutes here, which is what a job is
# given; the three over the reals take 27 minutes together and stay with the
# others
nightly:quad:
  extends: .nightly:test
  variables:
    CTEST_WHICH: -R
    CTEST_RE: ^quad_test/batches/batch.._I$
    # the three take 42, 33 and 58 minutes here, the last one being 17
    # instances that mostly run into the 300 seconds the configuration gives
    # SCIP: an hour each is not enough for it, an hour and a half is
    CTEST_TIMEOUT: "5400"

nightly:rest:
  extends: .nightly:test
  variables:
    # whatever the others do not take, the ones that want CPLEX apart
    CTEST_WHICH: -R
    CTEST_RE: .
    CTEST_TIMEOUT: "3600"
    CTEST_SKIP: ^(test_|Group_test|AbstractBlock|AbstractPath|SizeVariable|BoxSolver|Benders|Polyhedral|LagBFunction|QuadFunction|MILPSolver_|UCBlock_test|TUDPS_test|extract_uc|MCFBlock|MCFClassSolver|MCFLemonSolver|MMCFBlock|CFL_test|SingleFlowDCR|run_dmx|quad_test/batches/batch.._I$)

# The suites of tests/ that exercise one module, run on a commit of that module
# before it is pinned here. The pipeline of a module builds the module and its
# dependencies alone, and on a push to its develop it starts this one, passing
# its name and its commit [see the integration job of the modules], so that
# what the module does together with the others is checked at once, and not
# only on the night after its pin moves. The build is the one of the nightly,
# with the module moved from its pin to that commit, and the tests are the
# ones labelled with its name.
integration:
  extends: .nightly:test
  rules:
    - if: $SMSPP_MODULE && $SMSPP_SHA
  needs: []
  variables:
    CTEST_WHICH: -L
    CTEST_RE: ^${SMSPP_MODULE}$
    CTEST_TIMEOUT: "3600"
  script:
    - apt-get update && apt-get install -y --no-install-recommends ccache
    - git submodule sync --recursive
    - git submodule update --init --recursive
    # the module at the commit its pipeline was started for, in place of the
    # one the umbrella pins
    - git -C "$SMSPP_MODULE" fetch --quiet origin "$SMSPP_SHA"
    - git -C "$SMSPP_MODULE" checkout --quiet "$SMSPP_SHA"
    - git -C "$SMSPP_MODULE" submodule update --init --recursive
    - ccache --zero-stats
    - cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_tests=ON
            -DCMAKE_C_COMPILER_LAUNCHER=ccache
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
    - cmake --build build -j$(nproc)
    - ccache --show-stats
    - cd build && ctest -j2 --timeout "$CTEST_TIMEOUT" --repeat until-pass:2
                        --output-on-failure
                        --no-tests=error "$CTEST_WHICH" "$CTEST_RE"
                        -E "$CTEST_SKIP"

pages:
  stage: deploy
  script:
    - git submodule sync --recursive
    - git submodule update --init --recursive
    - if [ "$CI_COMMIT_BRANCH" == "master" ]; then git submodule foreach --recursive "git checkout master"; fi
    - if [ "$CI_COMMIT_BRANCH" == "develop" ]; then git submodule foreach --recursive "git checkout develop || git checkout master"; fi
    - doxygen doxygen/Doxyfile
    - mv doc/html/ public/
    # --- User Manual (MkDocs) served at /smspp-project/manual/ ---
    - apk add --no-cache python3 py3-pip
    - pip install --no-cache-dir --break-system-packages mkdocs-material
    - mkdocs build -f manual/build/mkdocs.yml -d "$CI_PROJECT_DIR/public/manual"
  artifacts:
    paths:
      - public
  when: manual

release_job:
  stage: release
  image:
      name: registry.gitlab.com/gitlab-org/cli:latest
      entrypoint: [""]
  rules:
    - if: $CI_COMMIT_TAG               # Run this job when a tag is created
  variables:
    GIT_DEPTH: 0                       # all the tags, for git describe
  script:
    - apk add --no-cache curl git python3 tar zip bzip2
    - echo "Creating GitLab Release..."
    - glab auth login --hostname gitlab.com --token $ANTONIO_PERSONAL_ACCESS_TOKEN --api-protocol https --git-protocol https
    - glab auth status
    - git submodule sync --recursive
    - git submodule update --init --recursive
    # the tarball carries no .git, so every VERSION.txt gets the version of its
    # repository here, as git archive would do from the export-subst
    - echo "$CI_COMMIT_TAG" > VERSION.txt
    - git submodule foreach --quiet --recursive 'v=$(git describe --tags --abbrev=0 2>/dev/null) && echo "$v" > VERSION.txt || true'
    - untagged=$(git submodule foreach --quiet --recursive 'git describe --tags --exact-match > /dev/null 2>&1 || echo "$displaypath"')
    - mkdir release-artifacts
    - previous_tag=$(git tag --sort=-creatordate | sed -n 2p)
    - echo "# Release $CI_COMMIT_TAG" >> release-artifacts/release_notes.md
    - echo "## Commits since $previous_tag:" >> release-artifacts/release_notes.md
    - git shortlog "${previous_tag}..${CI_COMMIT_TAG}" | sed 's/^./    &/' >> release-artifacts/release_notes.md
    - if [ -n "$untagged" ]; then echo "## Submodules not on a tag of their own:" >> release-artifacts/release_notes.md; echo "$untagged" | sed 's/^/    /' >> release-artifacts/release_notes.md; fi
    # the draft of the changelog of the release: what each module says in its
    # [Unreleased] and, under it, the commits it does not say anything about,
    # each module read between the gitlink of the previous tag and this one
    - ./changelog draft --from "$previous_tag" -o release-artifacts/changelog-draft.md
    - 'echo "## Draft of the changelog, in the changelog-draft.md of this release" >> release-artifacts/release_notes.md'
    - tar --exclude=release-artifacts --exclude='*/.*' --exclude='UCBlock/data' --exclude='UCBlock/tools/mathpower2netCDF' --exclude='.git*' --exclude='wiki' --exclude='org-profile' --exclude='CapacitatedFacilityLocationBlock/data' --exclude='MCFBlock/data' -czvf release-artifacts/smspp-project-${CI_COMMIT_TAG}.tar.gz .
    - ls -lh release-artifacts
    # the tarball also goes to the generic package registry, at a path that the
    # vcpkg port computes from the version alone
    - 'curl --fail --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file release-artifacts/smspp-project-${CI_COMMIT_TAG}.tar.gz "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/smspp-project/${CI_COMMIT_TAG}/smspp-project-${CI_COMMIT_TAG}.tar.gz"'
    - glab release create "$CI_COMMIT_TAG" -F release-artifacts/release_notes.md "release-artifacts/smspp-project-${CI_COMMIT_TAG}.tar.gz#Source code including submodules (tar.gz)#package" "release-artifacts/changelog-draft.md#Draft of the changelog, to be pruned#other"
  artifacts:
    paths:
      - release-artifacts/

# The new release in the vcpkg registry: the pipeline of vcpkg-registry updates
# the smspp port to the tag and pushes it.
vcpkg_registry:
  stage: release
  rules:
    - if: $CI_COMMIT_TAG
  needs: [release_job]
  variables:
    SMSPP_VERSION: $CI_COMMIT_TAG
  trigger:
    project: smspp/vcpkg-registry
    branch: develop
    strategy: depend

# The release pipeline of the packaging for the PPA builds the source package
# of the new tag and uploads it to Launchpad, if the key is in its variables.
ppa:
  stage: release
  rules:
    - if: $CI_COMMIT_TAG
  needs: [release_job]
  variables:
    SMSPP_VERSION: $CI_COMMIT_TAG
  trigger:
    project: smspp/ppa
    branch: develop

# The gitlink of vcpkg-registry follows the commit the update has just made,
# so that the project keeps pinning the registry that serves its own release.
# The push is with the job token, as the user who pushed the tag.
vcpkg_gitlink:
  stage: release
  image: alpine
  rules:
    - if: $CI_COMMIT_TAG
  needs: [vcpkg_registry]
  before_script:
    - apk add --no-cache git
    - git config user.name "$GITLAB_USER_NAME"
    - git config user.email "$GITLAB_USER_EMAIL"
  script:
    - sha=$(git ls-remote https://gitlab.com/smspp/vcpkg-registry.git develop | cut -f1)
    - git fetch origin develop
    - git checkout -B develop origin/develop
    - git update-index --cacheinfo 160000,"$sha",vcpkg-registry
    - git diff --cached --quiet && echo "already pinned" && exit 0
    - git commit -q -m "updated vcpkg-registry"
    - git push "https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/${CI_PROJECT_PATH}.git" HEAD:develop
