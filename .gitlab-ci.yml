image: alpine

before_script:
  - apk add --no-cache doxygen git

# A pipeline started by a module [see integration] runs on develop, where
# the pins move often: the push that moves one would cancel it as redundant
# before its turn on the licence of Gurobi comes, so it is not cancelled
workflow:
  rules:
    - if: $SMSPP_MODULE
      auto_cancel:
        on_new_commit: none
    - when: always

stages:
  - check
  - deploy
  - release

# The CHANGELOG of the umbrella, held to the format: the sections of Keep a
# Changelog and in its order, the dates, and one link reference per release
# that has a tag [see ./changelog]. It says nothing of the submodules, whose
# own pipelines check their own, so it needs no clone of them.
changelog:
  stage: check
  image: alpine
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    # a pipeline started by a module checks that module [see integration]
    - if: $SMSPP_MODULE
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
  variables:
    GIT_DEPTH: 0                       # the tags the links are checked against
  before_script:
    - apk add --no-cache git python3
  script:
    - ./changelog check --repo .

# The same over the whole project, submodules comprised, plus what the entries
# of their [Unreleased] do not say about the commits since their last tag.
# It is a report and not a gate, so it runs on a schedule and is allowed to
# fail: what it finds is read in its artifacts.
changelog_all:
  stage: check
  image: alpine
  rules:
    # the schedule of the night is the one that builds and tests, and has
    # nothing to do with this: each of the two schedules does its own thing
    - if: $NIGHTLY == "1"
      when: never
    # nor with the one of the packaging [see .packaging]
    - if: $PACKAGING == "1"
      when: never
    - if: $CI_PIPELINE_SOURCE == "schedule"
  variables:
    GIT_DEPTH: 0
  before_script:
    - apk add --no-cache git python3
  script:
    - git submodule sync --recursive
    - git submodule update --init --recursive
    - git submodule foreach --quiet 'git fetch --tags --quiet || true'
    - ./changelog check -q | tee changelog-check.txt
    - ./changelog coverage --list | tee changelog-coverage.txt
  allow_failure: true
  artifacts:
    paths:
      - changelog-check.txt
      - changelog-coverage.txt
    expire_in: 30 days

# The project built and tested as a whole, every night: what each module
# checks of itself in its own pipeline is its own, while what only the
# umbrella has is the modules together and the suites of tests/, which read
# the instances of one module and solve them with the Solver of another.
# It runs on the schedule that sets NIGHTLY, and nowhere else, being the one
# thing here that costs more than seconds. One job builds, the others take
# the build and run their share of the suites, each of them well inside the
# hour a job is given.
.nightly:
  image: registry.gitlab.com/smspp/smspp-project
  rules:
    - if: $NIGHTLY == "1"
  variables:
    GIT_DEPTH: 0
    CCACHE_DIR: $CI_PROJECT_DIR/.ccache
    CCACHE_MAXSIZE: 2G
    CTEST_SKIP: ^(test_cuts|test_dynamic|CFL_test/batches/batch-ben)
    # how long one test may take; the suites of the unit commitment and of
    # the dynamic programming ask for more [see the jobs below]
    CTEST_TIMEOUT: "900"
  before_script:
    # the Gurobi WLS license from the masked variables, as the modules do;
    # without them the tests that ask for Gurobi are the ones that fail
    - |
      if [ -n "$GRB_WLSSECRET" ]; then
        printf 'LICENSEID=%s\nWLSACCESSID=%s\nWLSSECRET=%s\n' \
          "$GRB_LICENSEID" "$GRB_WLSACCESSID" "$GRB_WLSSECRET" > /tmp/gurobi.lic
        export GRB_LICENSE_FILE=/tmp/gurobi.lic
      fi

nightly:build:
  extends: .nightly
  stage: check
  timeout: 55m
  cache:
    key: nightly-$CI_COMMIT_REF_SLUG
    paths:
      - .ccache
  script:
    - apt-get update && apt-get install -y --no-install-recommends ccache
    - git submodule sync --recursive
    - git submodule update --init --recursive
    - ccache --zero-stats
    - cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_tests=ON
            -DCMAKE_C_COMPILER_LAUNCHER=ccache
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
    - cmake --build build -j$(nproc)
    - ccache --show-stats

# The C++20 modules [see SMS++/cmake/CheckModule.cmake], which the build
# above leaves out, since its compiler is GCC, which does not build them, and
# its generator Unix Makefiles: here all of them are built with Clang and
# Ninja, where CMake turns them on by itself, and the test that imports the
# module of the core is run. A module that could not be built would be
# turned off with a message, hence the job also checks that none was. The
# interface of each module is then written again from the headers [see
# SMS++/cmake/smspp_module_exports.py], with the flags of this build, and
# the job fails if any of them is not the one in the repository, e.g.,
# because a header has gained a name that the module does not export.
nightly:modules:
  extends: .nightly
  stage: check
  timeout: 55m
  cache:
    key: nightly-modules-$CI_COMMIT_REF_SLUG
    paths:
      - .ccache
  script:
    - set -o pipefail
    - apt-get update && apt-get install -y --no-install-recommends
                         ccache clang clang-tools ninja-build
    - git submodule sync --recursive
    - git submodule update --init --recursive
    - ccache --zero-stats
    - cmake -S . -B build-modules -G Ninja -DCMAKE_BUILD_TYPE=Release
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
            -DCMAKE_C_COMPILER_LAUNCHER=ccache
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
            -DBUILD_tests=OFF 2>&1 | tee cmake.log
    - "! grep -q 'SMSpp_BUILD_MODULE is' cmake.log"
    - MODULES=$(ninja -C build-modules -t targets all |
                sed -n 's/^\([A-Za-z+]*_module\):.*/\1/p')
    - test -n "$MODULES"
    - cmake --build build-modules -j$(nproc) --target $MODULES Module_test
    - ccache --show-stats
    - python3 SMS++/cmake/smspp_module_exports.py --clang clang++
              --compdb build-modules/compile_commands.json
              --check --update */src/*.cppm
    - cd build-modules && ctest -R '^Module_test$' --output-on-failure

# The makefiles of all the modules, which have to keep building what CMake
# builds [see ci/makefile]: first with g++, then with clang++ and the C++20
# modules, which the test of the core then imports. FastFlow, which CMake
# would fetch, is cloned.
nightly:makefiles:
  extends: .nightly
  stage: check
  timeout: 3h
  cache:
    key: nightly-makefiles-$CI_COMMIT_REF_SLUG
    paths:
      - .ccache
  script:
    - apt-get update && apt-get install -y --no-install-recommends ccache
    - git submodule sync --recursive
    - git submodule update --init --recursive
    - git clone --quiet --depth 1 https://github.com/fastflow/fastflow.git
                /tmp/fastflow
    - ccache --zero-stats
    # the modules and the makefiles of the tests, of the tools and of the
    # experiments [see ci/makefiles], then the modules again with clang++
    # and the C++20 modules
    - ci/makefiles CC="ccache g++" FastFlow_ROOT=/tmp/fastflow
    - make -f ci/makefile clean-all
    - MODULES_ONLY=1 ci/makefiles CC="ccache clang++" SMSppMOD=1
                                  FastFlow_ROOT=/tmp/fastflow
    - ccache --show-stats
    - cd SMS++/test && make -f makefile-Module -j$(nproc) CC=clang++
                           FastFlow_ROOT=/tmp/fastflow
    - ./Module_test

# the build is not carried from one job to another: what is carried is the
# cache of ccache, which the job above fills, so that each of these compiles
# again in a few minutes instead of taking a build tree made in another
# container, where the paths CMake wrote are not the ones it finds.
#
# Each of them runs the suites of its share; the last one runs whatever the
# others do not, so that no suite is left out by a name nobody thought of.
.nightly:test:
  extends: .nightly
  stage: deploy
  # three hours, which is what a shared runner allows at most: the suites of
  # one job run one after the other, and the dynamic programming alone has
  # eleven of them, one of which re-runs four others end to end
  timeout: 3h
  # the WLS licence of the project gives two sessions at a time, and a
  # session is per container: four jobs solving with Gurobi at once are
  # refused the environment [GRBstartenv 10030], so they take their turn.
  # A resource_group of GitLab lets one job in at a time, hence the two
  # groups, gurobi-a and gurobi-b, one for each session the licence gives:
  # with a single group the eight jobs of the night run one after the other,
  # which is more than the day they have before the next night starts. Each
  # job names the group it belongs to; this is the default for whoever does
  # not [see nightly:core and its fellows]
  resource_group: gurobi-a
  retry:
    max: 2
    when: script_failure
  needs:
    - job: nightly:build
      artifacts: false
  cache:
    key: nightly-$CI_COMMIT_REF_SLUG
    paths:
      - .ccache
    policy: pull
  script:
    - !reference [ nightly:build , script ]
    # the two parts are kept apart because a quoted regex inside one variable
    # reaches ctest with its quotes and matches nothing
    # the suites whose configuration names CPXMILPSolver cannot run here,
    # the image of the project carrying no CPLEX
    # two tests at a time, which is what a runner of the shared fleet has
    # cores for; they cost one session of the licence between them, a session
    # being per container [see resource_group above]
    # a test refused the Gurobi environment because somebody else held the
    # sessions of the licence is tried again, which is not the same as
    # ignoring a failure: it has to pass on its own
    - cd build && ctest -j2 --timeout "$CTEST_TIMEOUT" --repeat until-pass:2
                        --output-on-failure
                        --no-tests=error "$CTEST_WHICH" "$CTEST_RE"
                        -E "$CTEST_SKIP"
  artifacts:
    when: always
    paths:
      - build/Testing/Temporary/LastTest.log
    expire_in: 7 days

# a runner of the shared fleet has two cores and is some times slower than
# the machines the batteries were written on: one of them takes 41 minutes
# there, so what a test may take is an hour, and the families that hold the
# long batteries are a job each, none of them near the three hours a job is
# given
nightly:core:
  extends: .nightly:test
  variables:
    CTEST_WHICH: -R
    CTEST_RE: ^(test_|Group_test|AbstractBlock|AbstractPath|SizeVariable|BoxSolver|Benders|Polyhedral|LagBFunction|QuadFunction|MILPSolver_)
    # the quadratic batteries over the integers have a job of their own, and
    # together they take more than two hours: without taking them out here
    # this job runs into the three of its own [see nightly:quad]
    CTEST_SKIP: ^(test_cuts|test_dynamic|CFL_test/batches/batch-ben|MILPSolver_QuadFunction_test/batches/batch.._I$)
    CTEST_TIMEOUT: "3600"

nightly:unitcommitment:
  extends: .nightly:test
  resource_group: gurobi-b
  variables:
    CTEST_WHICH: -R
    CTEST_RE: ^(UCBlock_test|extract_uc)
    CTEST_TIMEOUT: "3600"

# the dynamic programming of the thermal units is a job of its own: with the
# unit commitment it does not fit the time a job is given. The validation of
# the claim of the paper, which re-runs four batteries end to end, is another
nightly:tudps:
  extends: .nightly:test
  resource_group: gurobi-b
  variables:
    CTEST_WHICH: -R
    CTEST_RE: ^(TUDPS_test|extract_uc)
    CTEST_SKIP: ^TUDPS_test/batches-tub/run-validation
    CTEST_TIMEOUT: "3600"

nightly:validation:
  extends: .nightly:test
  resource_group: gurobi-b
  variables:
    CTEST_WHICH: -R
    CTEST_RE: ^TUDPS_test/batches-tub/run-validation
    CTEST_TIMEOUT: "7200"

# the flows are two jobs: the batteries of the min-cost flow take 40 minutes
# each on a machine of ours, hence more than an hour here
nightly:mcf:
  extends: .nightly:test
  resource_group: gurobi-b
  variables:
    CTEST_WHICH: -R
    CTEST_RE: ^(MCFBlock|MCFClassSolver|MCFLemonSolver|run_dmx)
    CTEST_TIMEOUT: "3600"

nightly:flows:
  extends: .nightly:test
  variables:
    CTEST_WHICH: -R
    CTEST_RE: ^(MMCFBlock|CFL_test|SingleFlowDCR)
    CTEST_TIMEOUT: "3600"

# the quadratic batteries over the integers are a job of their own: the three
# of them take 42, 33 and more than 60 minutes here, which is what a job is
# given; the three over the reals take 27 minutes together and stay with the
# others
nightly:quad:
  extends: .nightly:test
  variables:
    CTEST_WHICH: -R
    CTEST_RE: ^MILPSolver_QuadFunction_test/batches/batch.._I$
    # the three take 42, 33 and 58 minutes here, the last one being 17
    # instances that mostly run into the 300 seconds the configuration gives
    # SCIP: an hour each is not enough for it, an hour and a half is
    CTEST_TIMEOUT: "5400"

nightly:rest:
  extends: .nightly:test
  variables:
    # whatever the others do not take, the ones that want CPLEX apart
    CTEST_WHICH: -R
    CTEST_RE: .
    CTEST_TIMEOUT: "3600"
    CTEST_SKIP: ^(test_|Group_test|AbstractBlock|AbstractPath|SizeVariable|BoxSolver|Benders|Polyhedral|LagBFunction|QuadFunction|MILPSolver_|UCBlock_test|TUDPS_test|extract_uc|MCFBlock|MCFClassSolver|MCFLemonSolver|MMCFBlock|CFL_test|SingleFlowDCR|run_dmx)

# The suites of tests/ that exercise one module, run on a commit of that module
# before it is pinned here. The pipeline of a module builds the module and its
# dependencies alone, and on a push to its develop it starts this one, passing
# its name and its commit [see the integration job of the modules], so that
# what the module does together with the others is checked at once, and not
# only on the night after its pin moves. The build is the one of the nightly,
# with the module moved from its pin to that commit, and the tests are the
# ones labelled with its name.
integration:
  extends: .nightly:test
  rules:
    - if: $SMSPP_MODULE && $SMSPP_SHA
  needs: []
  variables:
    CTEST_WHICH: -L
    CTEST_TIMEOUT: "3600"
  script:
    - apt-get update && apt-get install -y --no-install-recommends ccache
    - git submodule sync --recursive
    - git submodule update --init --recursive
    # the module at the commit its pipeline was started for, in place of the
    # one the umbrella pins
    - git -C "$SMSPP_MODULE" fetch --quiet origin "$SMSPP_SHA"
    - git -C "$SMSPP_MODULE" checkout --quiet "$SMSPP_SHA"
    - git -C "$SMSPP_MODULE" submodule update --init --recursive
    - ccache --zero-stats
    - cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_tests=ON
            -DCMAKE_C_COMPILER_LAUNCHER=ccache
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
    - cmake --build build -j$(nproc)
    - ccache --show-stats
    # the label is the name of the module matched as it is: ctest reads -L as
    # a regex, where the "+" of "SMS++" are operators and match nothing
    - CTEST_RE="^$(printf '%s' "$SMSPP_MODULE" | sed 's/[][\.*^$+?(){}|]/\\&/g')\$"
    - cd build && ctest -j2 --timeout "$CTEST_TIMEOUT" --repeat until-pass:2
                        --output-on-failure
                        --no-tests=error "$CTEST_WHICH" "$CTEST_RE"
                        -E "$CTEST_SKIP"

# The recipes of packaging/, and the port of vcpkg-registry, built from the
# tarball of the commit before a release names them: one job makes the
# tarball as the release job does [see packaging/tarball.sh] and writes the
# recipes for it, each of the others builds the package of one channel
# with the modules of SMSPP_PKG_MODULES (and those they need), builds the
# consumer of packaging/consumer against it, which makes a UCBlock and a
# HiGHSMILPSolver by the factories, and solves the example of the Unit
# Commitment tool with HiGHS. The builds are long, hence the jobs run only
# when a push or a merge request touches what they check, or in a pipeline
# with PACKAGING set to 1 (a schedule, or Run pipeline by hand).
.packaging:
  rules:
    - if: $CI_COMMIT_TAG || $SMSPP_MODULE || $NIGHTLY == "1"
      when: never
    - if: $PACKAGING == "1"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: &packaging-changes
        - packaging/**/*
        - CMakeLists.txt
        - vcpkg-registry
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "develop"
      changes: *packaging-changes
    # a branch with a merge request is checked by the pipeline of the latter
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_OPEN_MERGE_REQUESTS
      when: never
    # a branch is compared with develop, since its first push has nothing
    # else to be compared with
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH
      changes:
        paths: *packaging-changes
        compare_to: refs/heads/develop
  variables:
    SMSPP_PKG_MODULES: ucblock,milp,mcfclass

packaging:tarball:
  extends: .packaging
  stage: check
  image: alpine
  timeout: 30m
  before_script:
    - apk add --no-cache git python3 tar
  script:
    - V=$(python3 -c 'import json; f = open("packaging/release.json");
                      print(json.load(f)["version"])')
    - packaging/tarball.sh "$V" release-artifacts
    - mkdir -p "dist/$V" && mv release-artifacts/*.tar.gz "dist/$V/"
    # the recipes for the tarball, at file:// of its directory, which is the
    # same in the jobs below; they take them with the tarball
    - python3 packaging/gen_recipes.py --modules "$SMSPP_PKG_MODULES"
              --tarball "dist/$V/smspp-project-$V.tar.gz"
    - git status --short packaging
  artifacts:
    paths:
      - dist/
      - packaging/
    expire_in: 3 days

.packaging:build:
  extends: .packaging
  stage: deploy
  needs: [packaging:tarball]
  timeout: 3h
  variables:
    DEBIAN_FRONTEND: noninteractive
  before_script: []

# the consumer built against the installation in $P, with the prefixes in
# $CMAKE_PREFIX_PATH; then the Unit Commitment tool of $P solves its example
.packaging:check:
  script:
    - cmake -S packaging/consumer -B build-use -DCMAKE_BUILD_TYPE=Release
            -DCMAKE_PREFIX_PATH="$P;$CMAKE_PREFIX_PATH"
    - cmake --build build-use
    - build-use/consumer
    - UC=$(find "$P"/ -name smspp_ucblock_solver -type f -perm -u+x |
           head -n 1)
    - EX=$(find "$P"/ -path '*ucblock_solver/examples/Bus_Test.nc4' |
           head -n 1)
    - '"$UC" "$EX" | tee uc.log'
    - grep -q 'Upper bound = 4.14035578e+05' uc.log

# the modules left out, as acronyms: all those that SMSPP_PKG_MODULES does
# not need
.packaging:off:
  script:
    - OFF=$(python3 -c "import sys; sys.path.insert(0, 'packaging');
              import modules as M;
              on = M.closure('$SMSPP_PKG_MODULES'.split(','));
              print(' '.join(m[1] for m in M.MODULES
                             if m[1] not in on + ['core']))")
    - echo "modules left out:" $OFF

# Spack, with the repository of packaging/spack: the compiler, CMake, Boost,
# Eigen and netCDF of Ubuntu as externals, HiGHS from the recipe of the
# repository; then the tests of the package
packaging:spack:
  extends: .packaging:build
  image: ubuntu:24.04
  variables:
    SPACK_VERSION: v1.2.2
  script:
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends build-essential
        ca-certificates curl file git gzip patch python3 unzip xz-utils
        bzip2 cmake help2man libboost-dev libeigen3-dev
        libnetcdf-c++4-dev libnetcdf-dev libhdf5-dev pkg-config
    - git clone --quiet --depth 1 -b "$SPACK_VERSION"
                https://github.com/spack/spack.git /opt/spack
    - . /opt/spack/share/spack/setup-env.sh
    - spack compiler find
    - spack external find cmake help2man pkgconf
    # the site scope, since spack external find writes the user one
    - |
      cat > /opt/spack/etc/spack/packages.yaml << END
      packages:
        boost:
          buildable: false
          externals:
          - spec: boost@1.83.0
            prefix: /usr
        eigen:
          buildable: false
          externals:
          - spec: eigen@3.4.0
            prefix: /usr
        netcdf-cxx4:
          buildable: false
          externals:
          - spec: netcdf-cxx4@4.3.1
            prefix: /usr
      END
    - spack config get packages
    - spack repo add packaging/spack/spack_repo/smspp
    - !reference [.packaging:off, script]
    - spack spec -I smspp $(printf ' ~%s' $OFF)
    - spack install --fail-fast smspp $(printf ' ~%s' $OFF)
    - spack test run smspp
    - eval "$(spack load --sh smspp)"
    - P=$(spack location -i smspp)
    - !reference [.packaging:check, script]

# Conan, with the recipes of packaging/conan under smspp/stable and the
# dependencies of Conan Center, built where Conan Center has no binary and
# kept in the cache; the test package of the recipe is run by conan create
packaging:conan:
  extends: .packaging:build
  image: ubuntu:24.04
  variables:
    CONAN_HOME: $CI_PROJECT_DIR/.conan2
  cache:
    key: packaging-conan
    # what was built is kept also when the job fails later
    when: always
    paths:
      - .conan2/p
  script:
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends build-essential
        ca-certificates cmake git pipx python3 help2man pkg-config
    - pipx install conan && export PATH="$HOME/.local/bin:$PATH"
    - conan profile detect --force
    - U="--user smspp --channel stable"
    - S="-s compiler.cppstd=20 -s build_type=Release"
    - conan create packaging/conan/netcdf-cxx4 --version 4.3.1 $U $S
                   --build=missing
    - V=$(ls dist)
    - !reference [.packaging:off, script]
    - O=$(printf ' -o smspp/*:%s=False' $OFF)
    - conan create packaging/conan/smspp --version "$V" $U $S $O
                   --build=missing
    # the package of smspp in the cache, and the prefixes of all the
    # packages of its graph, where the consumer finds what it needs
    # the binaries that the graph would skip are those of the static
    # libraries, which the consumer links too
    - conan install --requires="smspp/$V@smspp/stable" $S $O
                    -c tools.graph:skip_binaries=False --format=json
                    > graph.json
    - |
      eval "$(python3 - << 'END'
      import json
      g = json.load(open("graph.json"))["graph"]["nodes"].values()
      d = [n["package_folder"] for n in g if n.get("package_folder")]
      print("P=" + next(n["package_folder"] for n in g
                        if (n.get("ref") or "").startswith("smspp/")))
      print("CMAKE_PREFIX_PATH='" + ";".join(d) + "'")
      print("export LD_LIBRARY_PATH=" + ":".join(x + "/lib" for x in d))
      END
      )"
    - !reference [.packaging:check, script]

# Nix, with the package of packaging/nix on the nixpkgs of its flake.lock
# [see packaging/nix/ci.nix, which builds the consumer and runs the tool]
packaging:nix:
  extends: .packaging:build
  image: nixos/nix:2.35.4
  script:
    - echo "sandbox = false" >> /etc/nix/nix.conf
    - nix-build packaging/nix/ci.nix --argstr modules "$SMSPP_PKG_MODULES"
    - result/bin/consumer

# The AUR, with the split PKGBUILD of packaging/aur written for the modules
# of SMSPP_PKG_MODULES alone, built by makepkg as a user and installed
packaging:aur:
  extends: .packaging:build
  image: archlinux:base-devel
  script:
    - pacman -Syu --noconfirm --needed git cmake namcap
    - pacman -S --noconfirm --needed $(sed -n 's/^\tmakedepends = //p'
                packaging/aur/smspp-project/.SRCINFO)
    - useradd -m builder
    - mkdir -p /tmp/pkg && cp packaging/aur/smspp-project/PKGBUILD /tmp/pkg/
    - chown -R builder /tmp/pkg
    - su builder -c "cd /tmp/pkg && MAKEFLAGS=-j$(nproc)
                     CMAKE_BUILD_PARALLEL_LEVEL=$(nproc) makepkg --noconfirm"
    - namcap /tmp/pkg/PKGBUILD /tmp/pkg/*.pkg.tar.zst || true
    - pacman -U --noconfirm /tmp/pkg/*.pkg.tar.zst
    - P=/usr
    - !reference [.packaging:check, script]

# xmake, with the repository of packaging/xmake: a project that requires
# smspp with the modules of SMSPP_PKG_MODULES, whose dependencies xmake
# builds and keeps in the cache, all of them, CMake comprised: the FindHDF5
# of the CMake of Ubuntu does not find the static HDF5 of xmake
packaging:xmake:
  extends: .packaging:build
  image: ubuntu:24.04
  variables:
    XMAKE_VERSION: v3.1.2
    XMAKE_ROOT: "y"
    XMAKE_GLOBALDIR: $CI_PROJECT_DIR/.xmake-global
    # the packages are built inside the checkout, where git apply would take
    # the patches of xmake-repo as relative to the umbrella, and skip them
    GIT_CEILING_DIRECTORIES: $CI_PROJECT_DIR
  cache:
    key: packaging-xmake
    # what was built is kept also when the job fails later
    when: always
    paths:
      - .xmake-global/.xmake/packages
  script:
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends build-essential
        ca-certificates cmake curl git python3 help2man pkg-config unzip m4
        libncurses6
    - X=https://github.com/xmake-io/xmake/releases/download/$XMAKE_VERSION
    - curl -fsSL -o /usr/local/bin/xmake
           "$X/xmake-bundle-$XMAKE_VERSION.linux.x86_64"
    - chmod +x /usr/local/bin/xmake
    - !reference [.packaging:off, script]
    - mkdir use && cp packaging/consumer/consumer.cpp use/
    - |
      cat > use/xmake.lua << END
      add_repositories("smspp $CI_PROJECT_DIR/packaging/xmake")
      add_requires("smspp", {configs = {$(printf '%s = false, ' $OFF)}})
      add_requireconfs("**", {system = false})
      target("consumer")
          set_kind("binary")
          set_languages("c++20")
          add_files("consumer.cpp")
          add_packages("smspp")
      END
    - cat use/xmake.lua
    # -v makes xmake install the packages one at a time, which is what the
    # memory of a runner affords, and writes their builds to the log
    - (cd use && xmake f -y -c -v > ../xmake.log 2>&1) ||
      { tail -n 200 xmake.log; exit 1; }
    - (cd use && xmake -y && xmake run consumer)
    - P=$(dirname $(dirname $(find "$XMAKE_GLOBALDIR"/.xmake/packages/s/smspp
                                    -name smspp_ucblock_solver -type f |
                               head -n 1)))
    - '"$P/bin/smspp_ucblock_solver"
       "$P/share/SMS++_tools/ucblock_solver/examples/Bus_Test.nc4" |
       tee uc.log'
    - grep -q 'Upper bound = 4.14035578e+05' uc.log
  artifacts:
    when: on_failure
    paths:
      - xmake.log
    expire_in: 7 days

# vcpkg, with the port of vcpkg-registry as an overlay, the tarball put in
# the downloads of vcpkg under the name the port asks for; the binaries of
# the dependencies are kept in the cache. The triplet is the dynamic one:
# the libraries are shared in all the channels [see packaging/README.md]
packaging:vcpkg:
  extends: .packaging:build
  image: ubuntu:24.04
  variables:
    VCPKG_VERSION: 2026.10.16
    VCPKG_DEFAULT_BINARY_CACHE: $CI_PROJECT_DIR/.vcpkg-cache
  cache:
    key: packaging-vcpkg
    # what was built is kept also when the job fails later
    when: always
    paths:
      - .vcpkg-cache
  script:
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends build-essential
        ca-certificates cmake curl git ninja-build pkg-config python3 tar
        unzip zip autoconf automake autoconf-archive libtool bison flex
        linux-libc-dev help2man
    - mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
    - git submodule update --init vcpkg-registry
    - git clone --quiet --depth 1 -b "$VCPKG_VERSION"
                https://github.com/microsoft/vcpkg.git /opt/vcpkg
    - /opt/vcpkg/bootstrap-vcpkg.sh -disableMetrics
    - V=$(ls dist)
    - mkdir -p /tmp/dl && cp "dist/$V/smspp-project-$V.tar.gz" /tmp/dl/
    - cp -R vcpkg-registry/ports /tmp/ports
    - SHA=$(sha512sum < /tmp/dl/smspp-project-$V.tar.gz | cut -d' ' -f1)
    # the first SHA512 is that of the tarball, the other that of FastFlow
    - sed -i "0,/SHA512 /s|SHA512 [0-9a-f]*|SHA512 $SHA|"
             /tmp/ports/smspp/portfile.cmake
    - 'sed -i "s|\"version\": \"[^\"]*\"|\"version\": \"$V\"|"
              /tmp/ports/smspp/vcpkg.json'
    # out of the umbrella, whose vcpkg.json would make it a manifest
    - (cd /tmp && /opt/vcpkg/vcpkg install
         "smspp[core,tools,$SMSPP_PKG_MODULES]"
         --overlay-ports=/tmp/ports --downloads-root=/tmp/dl
         --x-install-root=/tmp/vcpkg-installed
         --triplet=x64-linux-dynamic --host-triplet=x64-linux-dynamic)
    - P=/tmp/vcpkg-installed/x64-linux-dynamic
    - !reference [.packaging:check, script]

# Homebrew, on macOS, with the formula of the tap of the project
# (SMSpp-Project/homebrew-smspp) pointed at the tarball; the test of the
# formula builds a consumer of UCBlock and runs the tools
packaging:homebrew:
  extends: .packaging:build
  image: macos-15-xcode-16
  tags: [saas-macos-medium-m1]
  variables:
    HOMEBREW_NO_AUTO_UPDATE: "1"
  script:
    - V=$(ls dist)
    - TGZ="$CI_PROJECT_DIR/dist/$V/smspp-project-$V.tar.gz"
    - SHA=$(shasum -a 256 "$TGZ" | cut -d' ' -f1)
    - brew tap smspp-project/smspp
    - brew trust smspp-project/smspp
    - F="$(brew --repository smspp-project/smspp)/Formula/smspp.rb"
    - sed -i '' -e "s|^  url .*|  url \"file://$TGZ\"|"
                -e "s|^  sha256 .*|  sha256 \"$SHA\"|" "$F"
    - brew install --build-from-source smspp-project/smspp/smspp
    - brew test smspp-project/smspp/smspp
    - P=$(brew --prefix smspp-project/smspp/smspp)
    - CMAKE_PREFIX_PATH=$(brew --prefix)
    - !reference [.packaging:check, script]

pages:
  stage: deploy
  variables:
    GIT_DEPTH: 0                       # the tags, for the version of Sphinx
  script:
    - git submodule sync --recursive
    - git submodule update --init --recursive
    - if [ "$CI_COMMIT_BRANCH" == "master" ]; then git submodule foreach --recursive "git checkout master || git checkout main"; fi
    - if [ "$CI_COMMIT_BRANCH" == "develop" ]; then git submodule foreach --recursive "git checkout develop || git checkout master || git checkout main"; fi
    - apk add --no-cache python3 py3-pip
    # --- Doxygen site served at /smspp-project/ ---
    # a first run writes the XML alone, from which sphinx/apiref.py (called
    # by pages.py) writes the pages of the Sphinx reference and the groups
    # of the Topics in doxygen/modules.dox, with the filters that put the
    # pages of the modules in their groups in doxygen/pages.cfg; a second
    # run with them writes the HTML
    - (cat doxygen/Doxyfile; echo "GENERATE_HTML = NO") | doxygen -
    - python3 sphinx/pages.py
    - (cat doxygen/Doxyfile doxygen/pages.cfg;
       echo "INPUT += doxygen/modules.dox"; echo "GENERATE_XML = NO") |
      doxygen -
    # the outline of a page in navtree.js (Doxygen 1.17) turns its names
    # into entities and then sets them as text, which shows "&#x2F;" for "/"
    - sed -i 's/textContent = escapeHtml(\(text\|name\))/textContent = \1/'
             doc/html/navtree.js
    - test "$(grep -c 'textContent = escapeHtml' doc/html/navtree.js)" = 0
    # the overloads in the outline with the types of their parameters
    - cat doxygen/outline-overloads.js >> doc/html/navtree.js
    - mv doc/html/ public/
    # --- User Manual (MkDocs) served at /smspp-project/manual/ ---
    - pip install --no-cache-dir --break-system-packages mkdocs-material
    - mkdocs build -f manual/build/mkdocs.yml -d "$CI_PROJECT_DIR/public/manual"
    # --- Sphinx site served at /smspp-project/sphinx/ ---
    # the same reference, read by Breathe from the XML that the Doxyfile
    # writes into doc/xml in the tree of pages that sphinx/apiref.py writes,
    # with the pages from the Markdown files
    - pip install --no-cache-dir --break-system-packages
                  -r sphinx/requirements.txt
    # the doctrees of Sphinx stay out of the site
    - sphinx-build -b html -d doc/doctrees sphinx
                   "$CI_PROJECT_DIR/public/sphinx"
  artifacts:
    paths:
      - public
  when: manual

release_job:
  stage: release
  image:
      name: registry.gitlab.com/gitlab-org/cli:latest
      entrypoint: [""]
  rules:
    - if: $CI_COMMIT_TAG               # Run this job when a tag is created
  variables:
    GIT_DEPTH: 0                       # all the tags, for git describe
  script:
    - apk add --no-cache curl git python3 tar zip bzip2
    - echo "Creating GitLab Release..."
    - glab auth login --hostname gitlab.com --token $ANTONIO_PERSONAL_ACCESS_TOKEN --api-protocol https --git-protocol https
    - glab auth status
    # the tarball of the release, which the packaging jobs make in the same
    # way out of the commit they check [see packaging/tarball.sh]
    - packaging/tarball.sh "$CI_COMMIT_TAG" release-artifacts
    - untagged=$(git submodule foreach --quiet --recursive 'git describe --tags --exact-match > /dev/null 2>&1 || echo "$displaypath"')
    - previous_tag=$(git tag --sort=-creatordate | sed -n 2p)
    - echo "# Release $CI_COMMIT_TAG" >> release-artifacts/release_notes.md
    - echo "## Commits since $previous_tag:" >> release-artifacts/release_notes.md
    - git shortlog "${previous_tag}..${CI_COMMIT_TAG}" | sed 's/^./    &/' >> release-artifacts/release_notes.md
    - if [ -n "$untagged" ]; then echo "## Submodules not on a tag of their own:" >> release-artifacts/release_notes.md; echo "$untagged" | sed 's/^/    /' >> release-artifacts/release_notes.md; fi
    # the draft of the changelog of the release: what each module says in its
    # [Unreleased] and, under it, the commits it does not say anything about,
    # each module read between the gitlink of the previous tag and this one
    - ./changelog draft --from "$previous_tag" -o release-artifacts/changelog-draft.md
    - 'echo "## Draft of the changelog, in the changelog-draft.md of this release" >> release-artifacts/release_notes.md'
    - ls -lh release-artifacts
    # the tarball also goes to the generic package registry, at a path that the
    # vcpkg port computes from the version alone
    - 'curl --fail --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file release-artifacts/smspp-project-${CI_COMMIT_TAG}.tar.gz "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/smspp-project/${CI_COMMIT_TAG}/smspp-project-${CI_COMMIT_TAG}.tar.gz"'
    - glab release create "$CI_COMMIT_TAG" -F release-artifacts/release_notes.md "release-artifacts/smspp-project-${CI_COMMIT_TAG}.tar.gz#Source code including submodules (tar.gz)#package" "release-artifacts/changelog-draft.md#Draft of the changelog, to be pruned#other"
  artifacts:
    paths:
      - release-artifacts/

# The new release in the vcpkg registry: the pipeline of vcpkg-registry updates
# the smspp port to the tag and pushes it.
vcpkg_registry:
  stage: release
  rules:
    - if: $CI_COMMIT_TAG
  needs: [release_job]
  variables:
    SMSPP_VERSION: $CI_COMMIT_TAG
  trigger:
    project: smspp/vcpkg-registry
    branch: develop
    strategy: depend

# The release pipeline of the packaging for the PPA builds the source package
# of the new tag and uploads it to Launchpad, if the key is in its variables.
ppa:
  stage: release
  rules:
    - if: $CI_COMMIT_TAG
  needs: [release_job]
  variables:
    SMSPP_VERSION: $CI_COMMIT_TAG
  trigger:
    project: smspp/ppa
    branch: develop

# The gitlink of vcpkg-registry follows the commit the update has just made,
# so that the project keeps pinning the registry that serves its own release.
# The push is with the job token, as the user who pushed the tag.
vcpkg_gitlink:
  stage: release
  image: alpine
  rules:
    - if: $CI_COMMIT_TAG
  needs: [vcpkg_registry]
  before_script:
    - apk add --no-cache git
    - git config user.name "$GITLAB_USER_NAME"
    - git config user.email "$GITLAB_USER_EMAIL"
  script:
    - sha=$(git ls-remote https://gitlab.com/smspp/vcpkg-registry.git develop | cut -f1)
    - git fetch origin develop
    - git checkout -B develop origin/develop
    - git update-index --cacheinfo 160000,"$sha",vcpkg-registry
    - git diff --cached --quiet && echo "already pinned" && exit 0
    - git commit -q -m "updated vcpkg-registry"
    - git push "https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/${CI_PROJECT_PATH}.git" HEAD:develop
