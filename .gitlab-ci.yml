image: alpine:3.11

before_script:
  - apk add --no-cache doxygen git bash
  # Create a list of all submodules
  - SUBM=`grep "smspp/" .gitmodules | awk -F '/' '{print $5}'`
  # Add "pages-job:$<module-name>_TOKEN" to .gitmodules URLs
  - for i in ${SUBM}; do TOKEN_NAME="${i}_TOKEN"; sed -i "s/gitlab.com\/smspp\/$i/pages-job:$TOKEN_NAME@gitlab.com\/smspp\/$i/" .gitmodules; done

pages:
  stage: deploy
  script:
    - git submodule sync --recursive
    - git submodule update --init --recursive
    - doxygen doxygen/Doxyfile
    - mv doc/html/ public/
  artifacts:
    paths:
      - public
  only:
    - master
