image: alpine:3.11

before_script:
  - apk add --no-cache doxygen git

pages:
  stage: deploy
  script:
    - git submodule sync --recursive
    - git submodule update --init --recursive
    - git submodule foreach --recursive "git checkout develop || git checkout master" 
    - doxygen doxygen/Doxyfile
    - mv doc/html/ public/
  artifacts:
    paths:
      - public
  when: manual