image: alpine:3.11

before_script:
  - apk add --no-cache doxygen git bash

pages:
  stage: deploy
  script:
    - ./add_tokens.sh
    - git submodule sync --recursive
    - git submodule update --init --recursive
    - doxygen doxygen/Doxyfile
    - mv doc/html/ public/
  artifacts:
    paths:
      - public
  only:
    - master
