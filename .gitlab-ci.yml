image: alpine

variables:
  GIT_SUBMODULE_STRATEGY: recursive

before_script:
  - apk update
  - apk add doxygen
## Uncomment the following line if you use graphviz dot graphs
#- apk add ttf-freefont graphviz

test:
  script:
    - doxygen doxygen/Doxyfile
  except:
    - master

pages:
  script:
    - doxygen doxygen/Doxyfile
    - mv doc/html/ public/
  artifacts:
    paths:
      - public
  only:
    - master
