image: alpine

before_script:
  - apk add --no-cache doxygen git

stages:
  - deploy
  - release

pages:
  stage: deploy
  script:
    - git submodule sync --recursive
    - git submodule update --init --recursive
    - if [ "$CI_COMMIT_BRANCH" == "master" ]; then git submodule foreach --recursive "git checkout master"; fi
    - if [ "$CI_COMMIT_BRANCH" == "develop" ]; then git submodule foreach --recursive "git checkout develop || git checkout master"; fi
    - doxygen doxygen/Doxyfile
    - mv doc/html/ public/
  artifacts:
    paths:
      - public
  when: manual

release_job:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: $CI_COMMIT_TAG                 # Run this job when a tag is created
  script:
    - apk add --no-cache git tar zip bzip2
    - git submodule sync --recursive
    - git submodule update --init --recursive
    - mkdir release-artifacts
    - previous_tag=$(git tag --sort=-creatordate | sed -n 2p)
    - echo "# Release $CI_COMMIT_TAG" >> release-artifacts/release_notes.md
    - echo "## Commits since $previous_tag:" >> release-artifacts/release_notes.md
    - git shortlog "${previous_tag}..${CI_COMMIT_TAG}" | sed 's/^./    &/' >> release-artifacts/release_notes.md
    - tar --exclude=release-artifacts --exclude='*/.*' -czf release-artifacts/source-${CI_COMMIT_TAG}.tar.gz .
    - zip -r release-artifacts/source-${CI_COMMIT_TAG}.zip . -x "release-artifacts/*" "*/.*"
    - release-cli create --name "Release $CI_COMMIT_TAG" \
      --tag-name "$CI_COMMIT_TAG" \
      --description "$(cat release-artifacts/release_notes.md)" \
      --assets-link "{\"name\":\"source-${CI_COMMIT_TAG}.tar.gz\",\"url\":\"$CI_PROJECT_URL/-/jobs/$CI_JOB_ID/artifacts/raw/release-artifacts/source-${CI_COMMIT_TAG}.tar.gz\"}" \
      --assets-link "{\"name\":\"source-${CI_COMMIT_TAG}.zip\",\"url\":\"$CI_PROJECT_URL/-/jobs/$CI_JOB_ID/artifacts/raw/release-artifacts/source-${CI_COMMIT_TAG}.zip\"}"
  artifacts:
    paths:
      - release-artifacts/