image: alpine

before_script:
  - apk add --no-cache doxygen git

stages:
  - deploy
  - release

variables:
  GITLAB_TOKEN: $RELEASE_TOKEN
  CI_COMMIT_TAG: 0.4.31

pages:
  stage: deploy
  script:
    - git submodule sync --recursive
    - git submodule update --init --recursive
    - if [ "$CI_COMMIT_BRANCH" == "master" ]; then git submodule foreach --recursive "git checkout master"; fi
    - if [ "$CI_COMMIT_BRANCH" == "develop" ]; then git submodule foreach --recursive "git checkout develop || git checkout master"; fi
    - doxygen doxygen/Doxyfile
    - mv doc/html/ public/
  artifacts:
    paths:
      - public
  when: manual

release_job:
  stage: release
  image:
      name: registry.gitlab.com/gitlab-org/cli:latest
      entrypoint: [""]
  # rules:
  #   - if: $CI_COMMIT_TAG                 # Run this job when a tag is created
  script:
    - apk add --no-cache git tar zip bzip2
    - echo "Creating GitLab Release..."
    - echo $RELEASE_TOKEN
    - echo $GITLAB_HOST
    - glab auth login --hostname gitlab.com --token $RELEASE_TOKEN --api-protocol https --git-protocol https
    - glab auth status
    - git submodule sync --recursive
    - git submodule update --init --recursive
    - mkdir release-artifacts
    - previous_tag=$(git tag --sort=-creatordate | sed -n 2p)
    - echo "# Release $CI_COMMIT_TAG" >> release-artifacts/release_notes.md
    - echo "## Commits since $previous_tag:" >> release-artifacts/release_notes.md
    - git shortlog "${previous_tag}..${CI_COMMIT_TAG}" | sed 's/^./    &/' >> release-artifacts/release_notes.md
    - tar --exclude=release-artifacts --exclude='*/.*' --exclude='UCBlock/netCDF_files' --exclude='tools/ucblock_solver/data' --exclude='UCBlock/LP_files' --exclude='.git*' --exclude='CapacitatedFacilityLocationBlock/data' --exclude='MCFBlock/data' -czvf release-artifacts/smspp-project-${CI_COMMIT_TAG}.tar.gz .
    - ls -lh release-artifacts
    - glab release create "$CI_COMMIT_TAG" -F release-artifacts/release_notes.md "release-artifacts/smspp-project-${CI_COMMIT_TAG}.tar.gz#Source code (tar.gz)#package"
  artifacts:
    paths:
      - release-artifacts/