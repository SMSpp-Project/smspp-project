image: alpine

variables:
  GIT_SUBMODULE_STRATEGY: recursive

before_script:
  - apk update
  - apk add doxygen
  - apk add openssh
  - eval $(ssh-agent -s)
  - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
#  - mkdir -p ~/.ssh
#  - chmod 700 ~/.ssh

test:
  script:
    - doxygen doxygen/Doxyfile
  except:
    - master

pages:
  script:
    - doxygen doxygen/Doxyfile
    - mv doc/html/ public/
  artifacts:
    paths:
      - public
  only:
    - master
