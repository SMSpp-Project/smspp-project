image: alpine

before_script:
  - apk add --no-cache doxygen git

stages:
  - deploy
  - release

pages:
  stage: deploy
  script:
    - git submodule sync --recursive
    - git submodule update --init --recursive
    - if [ "$CI_COMMIT_BRANCH" == "master" ]; then git submodule foreach --recursive "git checkout master"; fi
    - if [ "$CI_COMMIT_BRANCH" == "develop" ]; then git submodule foreach --recursive "git checkout develop || git checkout master"; fi
    - doxygen doxygen/Doxyfile
    - mv doc/html/ public/
  artifacts:
    paths:
      - public
  when: manual

release_job:
  stage: release
  image: registry.gitlab.com/gitlab-org/cli:latest
  rules:
    - if: $CI_COMMIT_TAG                 # Run this job when a tag is created
  script:
    - apk add --no-cache git tar zip bzip2
    - git submodule sync --recursive
    - git submodule update --init --recursive
    - mkdir release-artifacts
    - previous_tag=$(git tag --sort=-creatordate | sed -n 2p)
    - echo "# Release $CI_COMMIT_TAG" >> release-artifacts/release_notes.md
    - echo "## Commits since $previous_tag:" >> release-artifacts/release_notes.md
    - git shortlog "${previous_tag}..${CI_COMMIT_TAG}" | sed 's/^./    &/' >> release-artifacts/release_notes.md
    - tar --exclude=release-artifacts --exclude='*/.*' --exclude='UCBlock/netCDF_files' --exclude='tools/ucblock_solver/data' --exclude='UCBlock/LP_files' --exclude='.git*' -czvf release-artifacts/smspp-project-${CI_COMMIT_TAG}.tar.gz .
    - zip -r release-artifacts/smspp-project-${CI_COMMIT_TAG}.zip . -x "release-artifacts/*" -x "*/.*" -x "UCBlock/netCDF_files/*" -x "UCBlock/LP_files/*" -x "tools/ucblock_solver/data/*" -x ".git*"
    - ls -lh release-artifacts
    - glab auth login --token $RELEASE_TOKEN
    - glab api user
    - >
      glab release create "$CI_COMMIT_TAG" -F release-artifacts/release_notes.md
      --assets-links="[ { \"name\": \"smspp-project-${CI_COMMIT_TAG}.tar.gz\", \"url\": \"${CI_PROJECT_URL}/-/jobs/${CI_JOB_ID}/artifacts/raw/release-artifacts/smspp-project-${CI_COMMIT_TAG}.tar.gz\", \"link_type\": \"other\" }, { \"name\": \"smspp-project-${CI_COMMIT_TAG}.zip\", \"url\": \"${CI_PROJECT_URL}/-/jobs/${CI_JOB_ID}/artifacts/raw/release-artifacts/smspp-project-${CI_COMMIT_TAG}.zip\", \"link_type\": \"other\" } ]"
  artifacts:
    paths:
      - release-artifacts/