# --------------------------------------------------------------------------- #
# The layout of the code and of the configurations of a module, held to the   #
# style of SMS++ on a merge request.                                          #
#                                                                             #
# Every module includes this file:                                            #
#                                                                             #
#   include:                                                                  #
#     - project: smspp/smspp-project                                          #
#       ref: develop                                                          #
#       file: /ci/style.yml                                                   #
#                                                                             #
# which includes the check of the repository code-style (gitlab/style.yml at  #
# its tag v1, the one that the umbrella pins as scripts/code-style) and runs  #
# it in the stage build: on what the merge request changes, the C++ sources   #
# are checked in the style of its .clang-format and format.py, only in the    #
# lines changed, and the .txt configurations by scripts/cfgformat.py of the   #
# umbrella, whole, which STYLE_SETUP fetches before the check together with   #
# the .code-format that names it.                                             #
#                                                                             #
# The job fails, and the merge request cannot be merged, until they are in    #
# the style; the changes that put them there are kept as the artifact         #
# style.patch, and posted on the merge request as suggestions on its lines if #
# the variable STYLE_TOKEN (a project or group access token, of the role      #
# Reporter and with the scope api, masked) is set. From the umbrella,         #
# scripts/smspp-format --since origin/develop <files> does the same. A merge  #
# request that has to keep a layout of its own says so with [skip style] in   #
# the title.                                                                  #
# --------------------------------------------------------------------------- #

include:
  - remote: >-
      https://raw.githubusercontent.com/dmeoli/code-style/v1/gitlab/style.yml

# the job of the template, in the build stage that every module has (not in
# .pre, see ci/changelog.yml), with the formatter of the configurations
style:
  stage: build
  variables:
    SMSPP_RAW: "https://gitlab.com/smspp/smspp-project/-/raw/develop"
    STYLE_SETUP: >-
      python3 -c "import urllib.request as u;
      u.urlretrieve('$SMSPP_RAW/scripts/cfgformat.py', '/tmp/cfgformat.py')"
      && printf '*.txt  python3 /tmp/cfgformat.py\n' > .code-format
